services:
  minio:
    image: pgsty/silo:latest
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    restart: unless-stopped

  postgres:
    image: postgres:17
    ports:
      - "5433:5432"
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  lakekeeper:
    image: quay.io/lakekeeper/catalog:latest-main
    command: ["serve"]
    ports:
      - "8181:8181"
    environment:
      LAKEKEEPER__PG_ENCRYPTION_KEY: "This-is-NOT-Secure!"
      LAKEKEEPER__PG_DATABASE_URL_READ: "postgresql://postgres:postgres@postgres:5432/postgres"
      LAKEKEEPER__PG_DATABASE_URL_WRITE: "postgresql://postgres:postgres@postgres:5432/postgres"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  trino:
    image: trinodb/trino:476
    ports:
      - "8080:8080"
    volumes:
      - ./catalog:/etc/trino/catalog
    depends_on:
      - lakekeeper
      - minio
    restart: unless-stopped
  
  superset:
    build:
      context: ./superset
      dockerfile: Dockerfile
    image: lakehouse-superset-trino:6.0.0
    container_name: lakehouse-superset
    ports:
      - "8088:8088"
    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
    volumes:
      - ./superset_config.py:/app/pythonpath/superset_config.py:ro
      - superset-data:/app/superset_home
    depends_on:
      - trino
    restart: unless-stopped


volumes:
  minio-data:
    external: true
    name: minio-data
  pg-data:
    external: true
    name: pg-data
  superset-data:
    name: superset-data